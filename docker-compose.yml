services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bbc_school
      POSTGRES_USER: bbc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bbc_secure_change_me}
    volumes:
      - bbc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbc -d bbc_school"]
      interval: 5s
      timeout: 5s
      retries: 20

  whatsapp:
    build:
      context: ./server/whatsapp-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WA_BRIDGE_PORT: "3847"
      CHROME_PATH: /usr/bin/chromium
      WA_AUTH_DIR: /data/wa-auth
      WA_DATA_DIR: /data/wa-data
      WA_SEND_DELAY_MS: "2500"
    volumes:
      - bbc_wa_auth:/data/wa-auth
      - bbc_wa_data:/data/wa-data
      - bbc_uploads:/data/uploads:ro
    # Bridge is internal only — API proxies it
    expose:
      - "3847"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      whatsapp:
        condition: service_started
    environment:
      DATABASE_URL: postgres://bbc:${POSTGRES_PASSWORD:-bbc_secure_change_me}@db:5432/bbc_school
      JWT_SECRET: ${JWT_SECRET:-bbc-jwt-change-me-in-production}
      DIRECTOR_PASSWORD: ${DIRECTOR_PASSWORD:-Director2026}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminBBC2026}
      WHATSAPP_PASSWORD: ${WHATSAPP_PASSWORD:-WhatsApp2026}
      PORT: "3000"
      WEB_ROOT: /app/web
      SEED_JSON: /app/seed/school_data.json
      UPLOAD_DIR: /data/uploads
      WA_BRIDGE_URL: ${WA_BRIDGE_URL:-http://whatsapp:3847}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-black-forest-labs/flux.2-klein-4b}
    volumes:
      - bbc_uploads:/data/uploads
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:3000"

volumes:
  bbc_pgdata:
  bbc_uploads:
  bbc_wa_auth:
  bbc_wa_data:
